<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny's Mystery Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "@google/generative-ai": "https://esm.sh/@google/generative-ai@^0.24.1"
  }
}
</script>
<style>
  @keyframes pulse-light {
    0%, 100% { filter: blur(3px) drop-shadow(0 0 8px rgba(99, 102, 241, 0.7)); opacity: 0.7; }
    50% { filter: blur(1px) drop-shadow(0 0 16px rgba(99, 102, 241, 1)); opacity: 1; }
  }
  .animate-pulse-light {
    animation: pulse-light 3s infinite ease-in-out;
  }

  @keyframes bounce-dot {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }
  .animate-bounce-dot-1 { animation: bounce-dot 1.4s infinite ease-in-out; }
  .animate-bounce-dot-2 { animation: bounce-dot 1.4s infinite ease-in-out 0.2s; } /* staggered */
  .animate-bounce-dot-3 { animation: bounce-dot 1.4s infinite ease-in-out 0.4s; } /* staggered */

  /* Confetti Animations */
  @keyframes confetti-fall {
    0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @keyframes confetti-fade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes confetti-rotate {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: currentColor; /* Will be set by text color classes */
    border-radius: 2px;
    opacity: 0;
    animation: confetti-fall 8s linear infinite, confetti-fade 8s ease-out infinite, confetti-rotate 3s linear infinite;
  }
  <style>
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.6); }
    50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.9); }
  }

  .animate-pulse-glow {
    animation: pulse-glow 2s infinite ease-in-out;
  }


  /* Confetti color variations */
  .confetti-color-1 { color: #facc15; } /* yellow-400 */
  .confetti-color-2 { color: #f87171; } /* red-400 */
  .confetti-color-3 { color: #60a5fa; } /* blue-400 */
  .confetti-color-4 { color: #4ade80; } /* green-400 */
  .confetti-color-5 { color: #c084fc; } /* purple-400 */
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div id="root" class="w-full"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
